version: 2
updates:
  # The workflow pins its actions by SHA, which is only safe if something bumps
  # them - otherwise the pins quietly freeze on whatever was current the day
  # they were written, CVEs included.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Ljubljana"
    open-pull-requests-limit: 3
